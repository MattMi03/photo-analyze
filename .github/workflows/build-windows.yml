name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install opencv-python==4.11.0.86
          pip install numpy==1.26.4
          pip install pillow
          pip install mediapipe==0.10.21
          pip install paddlepaddle==2.6.2
          pip install paddleocr==2.10.0
          pip install insightface==0.7.3
          pip install onnxruntime==1.19.2
          pip install requests urllib3

      - name: Download InsightFace buffalo_l model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models\buffalo_l | Out-Null
          $urls = @(
            "https://ghfast.top/https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip",
            "https://gh-proxy.com/https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip",
            "https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            Write-Host "尝试下载: $u"
            try {
              Invoke-WebRequest -Uri $u -OutFile models\buffalo_l.zip -TimeoutSec 180
              if ((Get-Item models\buffalo_l.zip).Length -gt 1000000) {
                $ok = $true
                break
              }
            } catch {
              Write-Host "失败: $_"
            }
          }
          if (-not $ok) { throw "所有镜像下载均失败" }
          Expand-Archive -Path models\buffalo_l.zip -DestinationPath models\buffalo_l -Force
          Remove-Item models\buffalo_l.zip
          Get-ChildItem models\buffalo_l

      - name: Download PaddleOCR models (offline pack)
        shell: pwsh
        run: |
          # 预下载 PaddleOCR 检测/识别/方向分类模型，随 exe 一起打包，避免首次运行联网
          python -c "from paddleocr import PaddleOCR; PaddleOCR(use_angle_cls=True, lang='ch', show_log=False)"
          Write-Host "PaddleOCR 模型已缓存到用户目录"

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed ^
            --name "PhotoIDTool" ^
            --add-data "models;models" ^
            --collect-all paddleocr ^
            --collect-all paddle ^
            --collect-all pyclipper ^
            --collect-all skimage ^
            --collect-all imgaug ^
            --collect-all lmdb ^
            --collect-all insightface ^
            --collect-all onnxruntime ^
            --hidden-import=mediapipe ^
            --hidden-import=cv2 ^
            --hidden-import=PIL ^
            --hidden-import=PIL._tkinter_finder ^
            --hidden-import=scipy.special ^
            --hidden-import=scipy._lib.messagestream ^
            --hidden-import=urllib3 ^
            --hidden-import=requests ^
            --hidden-import=charset_normalizer ^
            --hidden-import=idna ^
            --hidden-import=certifi ^
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoIDTool-Windows
          path: dist/PhotoIDTool.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoIDTool.exe
          generate_release_notes: true