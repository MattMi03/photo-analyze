name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: photo-processing-service

jobs:
  # ==================== 客户端：Windows exe（轻量 GUI，调用 Java 后端） ====================
  build-client:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r client_requirements.txt

      - name: Verify imports
        run: |
          python -c "import cv2, numpy, PIL, requests; print('client deps OK')"

      - name: Build PhotoIDClient.exe
        shell: cmd
        run: |
            pyinstaller --onefile --windowed --name "PhotoIDClient" ^
            --add-data "assets;assets" ^
            --hidden-import=cv2 ^
            --hidden-import=PIL ^
            --hidden-import=PIL._tkinter_finder ^
            --hidden-import=PIL.ImageTk ^
            --hidden-import=requests ^
            --hidden-import=urllib3 ^
            --hidden-import=charset_normalizer ^
            --hidden-import=idna ^
            --hidden-import=certifi ^
            client_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoIDClient-Windows
          path: photo-processing-service/dist/PhotoIDClient.exe

  # ==================== 服务端：Docker 镜像（Linux amd64，含全部 ML 模型） ====================
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t photo-processing-service:latest .

      - name: Export image as tar
        run: |
          docker save photo-processing-service:latest -o photo-processing-service.tar
          ls -lh photo-processing-service.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-processing-service-docker
          path: photo-processing-service/photo-processing-service.tar
          compression-level: 0

  # ==================== 发版 ====================
  release:
    needs: [build-client, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PhotoIDClient-Windows/PhotoIDClient.exe
            artifacts/photo-processing-service-docker/photo-processing-service.tar
          generate_release_notes: true
